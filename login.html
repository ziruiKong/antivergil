<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antivergil</title>
  <base href="/" />
  <script>if(/\/login\.html$/i.test(location.pathname))history.replaceState(null,"","/login/"+location.search);</script>
  <link rel="icon" href="assets/favicon.png?v=20261124-favicon-1" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20261124-favicon-1" />
  <link rel="stylesheet" href="login.css?v=20261125-nav-font-1" />
</head>
<body>
  <main class="login-shell">
    <header class="login-header">
      <nav class="login-nav" aria-label="Site">
        <a class="login-nav-link login-nav-about" href="/about/">ABOUT</a>
        <a class="login-brand" id="login-back" href="/about/" aria-label="Antivergil about">
          <img src="assets/antivergil-logo-cutout.png?v=20261124-logo-cutout-1" alt="" />
        </a>
        <a class="login-nav-link login-nav-contact" href="mailto:zk2332@columbia.edu">CONTACT</a>
      </nav>
    </header>

    <section class="login-main" aria-labelledby="login-title">
      <h1 class="visually-hidden" id="login-title">Sign in to Antivergil</h1>

      <div class="login-marquee" aria-hidden="true">
        <div class="login-marquee-track">
          <span>Plan your semester</span>
          <span>Plan your semester</span>
        </div>
      </div>

      <figure class="login-visual">
        <img src="assets/butler-library-night.jpg?v=20261124-butler-night-1" alt="Alma Mater facing Butler Library at dusk" />
      </figure>

      <div class="login-panel">
        <div class="login-auth">
          <div class="google-login-mount" id="google-login-mount"></div>
          <button class="google-login" id="google-login" type="button">
            <span>Continue with LionMail</span>
          </button>

          <button class="email-register-link" id="show-email-register" type="button">Continue with email</button>
          <form id="email-register-form" class="email-form email-register-form" hidden>
            <div class="email-register-row">
              <label><span>Email address</span><input id="registration-email" class="email-input" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" maxlength="254" required /></label>
              <button class="email-submit" type="submit">Continue</button>
            </div>
            <button class="email-back-link" id="back-to-google" type="button">Use LionMail</button>
          </form>



          <form id="code-form" class="email-form" hidden><p class="verification-notice">A six-digit code has been sent to<br><strong id="code-destination"></strong></p><div class="code-input-wrap"><div class="code-digit-display" aria-hidden="true"><span class="code-digit"></span><span class="code-digit"></span><span class="code-digit"></span><span class="code-digit"></span><span class="code-digit"></span><span class="code-digit"></span></div><input id="verification-code" aria-label="Six-digit verification code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required /></div><p id="verification-feedback" role="status" aria-live="polite"></p><div class="verification-actions"><button type="button" id="change-email">Switch account</button><button type="button" id="resend-code">Resend code</button></div></form>
          <p class="login-status" id="login-status" aria-live="polite" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <script src="data/auth-config.js?v=20261125-schedule-cloud"></script>
  <script src="profile-store.js?v=20261125-all-accounts-1"></script>
  <script src="schedule-cloud.js?v=2"></script>
  <script src="verification-input.js?v=1"></script>
  <script src="login.js?v=20261126-auth-cookie-1"></script>
</body>
</html>
