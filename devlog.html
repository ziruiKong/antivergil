  <style>
    :root { color-scheme: light; --paper:#f3f3f0; --ink:#121212; --muted:#777873; --rule:rgba(18,18,18,.34); }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--paper); scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    .site-header { padding:28px clamp(22px,2.25vw,34px) 0; }
    .site-nav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:28px; }
    .site-nav__link { color:var(--ink); text-decoration:none; font:500 12px/1 ui-monospace,"SFMono-Regular",Consolas,monospace; transition:opacity 160ms ease; }
    .site-nav__link:hover { opacity:.5; }
    .site-nav__link:last-child { justify-self:end; }
    .brand { display:flex; width:78px; align-items:center; justify-content:center; }
    .brand img { display:block; width:100%; height:auto; }
    main { width:100%; padding:34px clamp(22px,2.25vw,34px) 84px; }
    .log-head,.log-entry { display:grid; grid-template-columns:minmax(220px,32.5%) minmax(0,1fr); }
    .log-head { align-items:end; min-height:54px; padding:0 0 17px; border-bottom:1px solid var(--ink); }
    .log-head span { font:500 15px/1.2 ui-monospace,"SFMono-Regular",Consolas,monospace; letter-spacing:.035em; text-transform:uppercase; }
    .log-entry { align-items:center; min-height:110px; padding:25px 14px; border-bottom:1px solid var(--rule); outline:none; transition:background-color 180ms ease; }
    .log-entry:hover,.log-entry:focus { background:#e8e9e5; }
    .log-entry__date { padding-right:24px; color:#343632; font-size:21px; line-height:1.4; font-variant-numeric:tabular-nums; }
    .log-entry__title { display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:23px; font-weight:600; line-height:1.4; letter-spacing:.005em; }
    .log-entry__title::after { flex:none; color:var(--muted); content:"⌄"; font-size:20px; font-weight:400; transition:transform 180ms ease,color 180ms ease; }
    .log-entry:hover .log-entry__title::after,.log-entry:focus .log-entry__title::after { color:var(--ink); transform:rotate(180deg); }
    .log-entry__details { display:grid; grid-column:1 / -1; grid-template-columns:minmax(220px,32.5%) minmax(0,1fr); width:100%; max-height:0; margin-top:0; overflow:hidden; color:#343632; opacity:0; visibility:hidden; transform:translateY(-5px); transition:max-height 220ms ease,margin 180ms ease,opacity 160ms ease,transform 180ms ease,visibility 180ms; }
    .log-entry:hover .log-entry__details,.log-entry:focus .log-entry__details { max-height:120px; margin-top:12px; opacity:1; visibility:visible; transform:translateY(0); }
    .log-entry__summary { grid-column:2; max-width:62ch; margin:0; font-size:19px; line-height:1.55; }
    @media (max-width:700px) {
      .site-header { padding:22px 20px 0; }
      .brand { width:72px; }
      main { padding:29px 20px 64px; }
      .log-head,.log-entry { grid-template-columns:minmax(170px,34%) minmax(0,1fr); }
      .log-head { min-height:48px; padding-bottom:14px; }
      .log-head span { font-size:13px; }
      .log-entry { min-height:88px; padding:19px 10px; }
      .log-entry__date { padding-right:14px; font-size:17px; }
      .log-entry__title { font-size:19px; }
      .log-entry__summary { font-size:16px; }
    }
    @media (max-width:520px) {
      .site-header { padding-top:20px; }
      .brand { width:68px; }
      main { padding:26px 18px 56px; }
      .log-head,.log-entry { grid-template-columns:1fr; }
      .log-head { min-height:38px; padding-bottom:12px; }
      .log-head span { font-size:12px; }
      .log-entry { min-height:0; padding:18px 0; }
      .log-entry { padding:16px 10px; }
      .log-entry__date { padding:0 0 7px; color:var(--muted); font-size:16px; }
      .log-entry__title { font-size:19px; }
      .log-entry__details { grid-template-columns:1fr; }
      .log-entry:hover .log-entry__details,.log-entry:focus .log-entry__details { max-height:160px; margin-top:9px; }
      .log-entry__summary { grid-column:1; font-size:16px; line-height:1.5; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }
  </style>
</head>

  <script>
    (() => {
      const records = JSON.parse(document.getElementById('deployment-data').textContent);
      const summaries = {
        88: 'Adjusted the Friends panel so its height aligns with the surrounding profile cards.',
        87: 'Refined the Friends and sign-out actions for a clearer profile experience.',
        4: 'Refreshed the course snapshots with the latest official enrollment data.',

        77: 'Added local sign-in previews and a return path from verification.',
        76: 'Refined typography across the sign-in actions.',

        74: 'Improved the visual hierarchy of the email sign-in text.',
        73: 'Aligned email sign-in typography with the privacy settings.',
        72: 'Stabilized the homepage gallery and Safari privacy control.',
        71: 'Added consent-based privacy analytics and refreshed the homepage.',
        70: 'Released an updated site experience and privacy settings.'
      };
      const list = document.getElementById('deployment-log');
      const fragment = document.createDocumentFragment();
      for (const record of records) {
        const item = document.createElement('article');
        item.className = 'log-entry';
        item.tabIndex = 0;
        item.setAttribute('aria-label', `Deployment ${record.run}: ${record.title}`);
        const date = document.createElement('div');
        date.className = 'log-entry__date';
        date.textContent = record.date;
        const title = document.createElement('div');
        title.className = 'log-entry__title';
        title.textContent = record.title;
        const details = document.createElement('div');
        details.className = 'log-entry__details';
        const summary = document.createElement('p');
        summary.className = 'log-entry__summary';
        summary.textContent = summaries[record.run] || record.title;
        details.append(summary);
        item.append(date, title, details);
        fragment.append(item);
      }
      list.replaceChildren(fragment);
    })();
  </script>
