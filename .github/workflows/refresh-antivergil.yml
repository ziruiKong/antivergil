name: Refresh Antivergil data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh official enrollment data
        env:
          DATA_SYNC_INTERVAL_MINUTES: "60"
        run: node sync-data.mjs

      - name: Refresh CULPA cache on the first run of each day
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
        run: node build-culpa-cache.mjs

      - name: Commit updated snapshots
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "antivergil-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh course data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Assemble static site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site
          cp -R assets data CNAME index.html home.html login.html styles.css app.js home-motion.css home-motion.js login.css login.js campus-model.js _site/

      - name: Upload site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy refreshed site
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
